[package]
name = "fm-game"
version = "0.1.0"
description = "Football Manager Desktop Game"
authors = ["Azib Fikri"]
edition = "2021"

[lib]
name = "fm_game_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
